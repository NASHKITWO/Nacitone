name: Release APK

# Cara pakai: buat tag, mis. `git tag v1.0.0 && git push origin v1.0.0`.
# Atau jalankan manual dari tab Actions dan isi nomor versi.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Nomor versi tanpa 'v' (mis. 1.0.0). Harus sama dengan versionName di app/build.gradle.kts"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build dan terbitkan rilis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Pastikan versi sama dengan versionName
        run: |
          WANT="${VERSION#v}"
          HAVE=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          if [ "$WANT" != "$HAVE" ]; then
            echo "Versi rilis ($WANT) tidak sama dengan versionName ($HAVE) di app/build.gradle.kts" >&2
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Siapkan keystore dari secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret KEYSTORE_BASE64 belum diisi. Lihat PANDUAN_RILIS.md" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/release.jks"
          echo "STORE_FILE=$RUNNER_TEMP/keys/release.jks" >> "$GITHUB_ENV"

      - name: Build APK rilis (FOSS)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: ./gradlew --console=plain :app:assembleFossRelease --warning-mode summary

      - name: Ganti nama APK sesuai pola pemeriksa update
        run: |
          APK=$(find app/build/outputs/apk/foss/release -name "*.apk" | head -n 1)
          test -n "$APK" || { echo "APK tidak ditemukan" >&2; exit 1; }
          # Updater mengenali "app-<arsitektur>-release.apk"; build ini universal.
          cp "$APK" app-universal-release.apk
          ls -la app-universal-release.apk

      - name: Terbitkan rilis GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${VERSION#v}"
          TAG="v${VER}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          gh release create "$TAG" app-universal-release.apk \
            --title "$VER" \
            --notes-file changelog.md \
            --verify-tag
